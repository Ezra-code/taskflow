name: TaskFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Verify Prisma Client
        run: test -f node_modules/.prisma/client/default.js

      - name: Run tests
        run: npm test
        env:
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
          GOOGLE_CALLBACK_URL: http://localhost:5000/api/v1/auth/google/callback
          GOOGLE_CALENDAR_CALLBACK_URL: http://localhost:5000/api/v1/auth/google/calendar/callback
          GOOGLE_OAUTH_STATE_SECRET: test-oauth-state-secret